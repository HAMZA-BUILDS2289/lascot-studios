<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lascot Studio · Owner dashboard</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fff;--surface:#F5F8FF;--ink:#101828;--mid:#667085;--line:#E4EAF3;--accent:#023BE4;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#023BE4;--surface:rgba(255,255,255,.1);--ink:#fff;--mid:rgba(255,255,255,.74);--line:rgba(255,255,255,.24);--accent:#fff;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font:500 15px Manrope,sans-serif;background:var(--bg);color:var(--ink)}h1,h2{font-family:'Space Grotesk',sans-serif;letter-spacing:-.03em;font-weight:500}h1{font-size:32px;margin:0 0 6px}.muted{color:var(--mid)}
#app{display:none;grid-template-columns:230px 1fr;min-height:100vh}aside{border-right:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{display:flex;align-items:center;gap:10px;font:600 15px 'Space Grotesk';letter-spacing:.1em;margin-bottom:18px}aside img{width:32px}aside a{padding:9px 12px;border-radius:10px;text-decoration:none;color:inherit;font-weight:600;font-size:14px}aside a.on{background:var(--surface)}
main{padding:34px;max-width:1100px;width:100%}.btn{display:inline-flex;align-items:center;height:42px;padding:0 20px;border-radius:99px;border:1px solid var(--ink);background:none;color:var(--ink);font:600 12px Manrope;letter-spacing:.06em;cursor:pointer}.btn.p{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.link{background:none;border:0;color:var(--mid);cursor:pointer;font:600 13px Manrope;text-decoration:underline;text-align:left;padding:8px 12px}
.row{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;background:var(--surface);display:grid;gap:12px}.row[hidden]{display:none}.row label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--mid)}.row label.ck{display:flex;align-items:center;gap:8px;color:var(--ink)}
input,textarea,select{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:500 14px Manrope;max-width:100%}.row input[type=checkbox]{width:auto}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.gi{display:flex;gap:8px;flex-wrap:wrap}.thumb{width:120px;height:90px;object-fit:cover;border-radius:10px;background:var(--line)}.hd{display:flex;gap:12px;align-items:center}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:22px}.card{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--surface)}.card b{display:block;font:500 34px 'Space Grotesk';margin-top:4px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}#login form{width:100%;max-width:380px;display:grid;gap:12px}#login img{width:56px}#login input{height:46px}.err{color:#B42318;font-size:14px}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}main{padding:20px}}

/* ===== GLASS DASHBOARD ===== */
:root,:root{--ink:#fff;--mid:rgba(255,255,255,.78);--line:rgba(255,255,255,.3);--surface:rgba(255,255,255,.16);--bg:#0c5a9e;--accent:#19c3f3;color-scheme:light}
html{background:#0b4f9a;min-height:100%}
body{background:radial-gradient(900px 640px at 6% 0%,rgba(72,190,255,.55),transparent 62%),radial-gradient(800px 640px at 100% 30%,rgba(34,211,200,.42),transparent 60%),radial-gradient(900px 700px at 35% 105%,rgba(20,70,200,.55),transparent 60%),linear-gradient(150deg,#08357f 0%,#0c6aae 52%,#1fa6c4 100%);background-attachment:fixed;color:#fff;min-height:100vh}
#app{grid-template-columns:262px minmax(0,1fr);gap:16px;padding:16px}
aside{position:sticky;top:16px;height:calc(100vh - 32px);border:1px solid rgba(255,255,255,.3);border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.07));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:0 18px 50px rgba(2,20,70,.35),inset 0 1px 0 rgba(255,255,255,.4);padding:18px 14px;gap:2px}
aside .brand{align-items:center;gap:11px;padding:6px 8px 16px;margin:0;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:8px;line-height:1.1}aside .brand img{width:36px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.5)}aside .brand small{display:block;font:500 11px Manrope;letter-spacing:.04em;opacity:.78;margin-top:3px}aside .brand{flex-wrap:wrap}
#nav{display:flex;flex-direction:column;gap:2px;overflow:auto}.gl{font:700 10.5px Manrope;letter-spacing:.14em;text-transform:uppercase;opacity:.62;padding:14px 12px 5px}
aside a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:13px;color:#fff;font:600 13.5px Manrope;transition:background .2s,transform .2s}aside a svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}aside a span{flex:1}
aside a:hover{background:rgba(255,255,255,.16)}aside a.on{background:linear-gradient(135deg,#27d3f7,#0f9bea);box-shadow:0 8px 22px rgba(15,155,234,.5),inset 0 1px 0 rgba(255,255,255,.5);color:#05264d}
.bd{font:700 10.5px Manrope;font-style:normal;background:#fff;color:#0a5fb0;border-radius:99px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center}.bd[hidden]{display:none}aside a.on .bd{background:#05264d;color:#fff}
aside .link{color:#fff;opacity:.85;text-decoration:none;border-radius:13px;padding:10px 12px}aside .link:hover{background:rgba(255,255,255,.16)}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
#tb{display:flex;align-items:center;gap:12px;height:62px;padding:0 14px 0 18px;border:1px solid rgba(255,255,255,.3);border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.07));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);box-shadow:0 12px 36px rgba(2,20,70,.28),inset 0 1px 0 rgba(255,255,255,.4)}
#tb input{flex:1;max-width:460px;height:40px;border-radius:99px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);color:#fff;padding:0 16px}#tb input::placeholder{color:rgba(255,255,255,.7)}
#tb .vs{margin-left:auto;color:#fff;font:600 13px Manrope;text-decoration:none;padding:9px 16px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}#tb .vs:hover{background:rgba(255,255,255,.28)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 15px 'Space Grotesk';background:linear-gradient(135deg,#27d3f7,#1f6bff);box-shadow:0 0 0 2px rgba(255,255,255,.55)}
main{max-width:none;flex:1;padding:30px;border:1px solid rgba(255,255,255,.34);border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.1));backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);box-shadow:0 20px 60px rgba(2,20,70,.3),inset 0 1px 0 rgba(255,255,255,.45)}
main h1{color:#fff;text-shadow:0 2px 18px rgba(2,30,90,.25)}main .muted{color:rgba(255,255,255,.82)}
.row,.card,.row.err{--ink:#101828;--mid:#667085;--line:rgba(16,24,40,.12);--bg:rgba(255,255,255,.92);--accent:#023BE4;color:#101828}
.row,.card{border:1px solid rgba(255,255,255,.8);background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.72));box-shadow:0 10px 30px rgba(2,30,90,.16),inset 0 1px 0 #fff;border-radius:20px}
.card b{background:linear-gradient(135deg,#0a5fb0,#023BE4);-webkit-background-clip:text;background-clip:text;color:transparent}
.row .muted,.card .muted{color:#667085}
input,textarea,select{background:rgba(255,255,255,.88);border:1px solid rgba(16,24,40,.12);color:#101828}
main>.bar input,main>.bar select{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);color:#fff}main>.bar select option{color:#101828}main>.bar input::placeholder{color:rgba(255,255,255,.75)}
.btn{border-color:rgba(255,255,255,.7);color:#fff;background:rgba(255,255,255,.14);backdrop-filter:blur(8px)}.btn:hover{background:rgba(255,255,255,.28)}
.row .btn,.card .btn{border-color:rgba(16,24,40,.35);color:#101828;background:rgba(255,255,255,.6)}.row .btn:hover{background:#fff}
.btn.p,.row .btn.p{background:linear-gradient(135deg,#27d3f7,#1f6bff);border:0;color:#fff;box-shadow:0 8px 22px rgba(31,107,255,.4)}.btn.p:hover{filter:brightness(1.07)}
.link{color:rgba(255,255,255,.85)}.row a{color:#0a5fb0}
#login{background:none}#login form{padding:34px;border-radius:28px;border:1px solid rgba(255,255,255,.4);background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.1));backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 24px 70px rgba(2,20,70,.4),inset 0 1px 0 rgba(255,255,255,.5)}#login input{background:rgba(255,255,255,.9)}#login .err{color:#ffd4d0}
@media(max-width:760px){#app{grid-template-columns:1fr;padding:10px;gap:10px}aside{position:static;height:auto;border-radius:22px}#nav{flex-direction:row;flex-wrap:wrap}.gl{display:none}aside a{padding:8px 11px}aside .brand{border:0;padding-bottom:6px}#tb{height:54px}#tb .vs{display:none}main{padding:18px;border-radius:22px}}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:22px}
.kp{--ink:#101828;--mid:#667085;position:relative;display:grid;gap:2px;padding:18px 18px 16px;border-radius:22px;border:1px solid rgba(255,255,255,.8);background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.7));box-shadow:0 10px 30px rgba(2,30,90,.16),inset 0 1px 0 #fff;color:#101828;text-decoration:none;transition:transform .2s,box-shadow .2s}.kp:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(2,30,90,.24),inset 0 1px 0 #fff}
.kp i{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#27d3f7,#1f6bff);box-shadow:0 8px 18px rgba(31,107,255,.35);margin-bottom:10px}.kp i svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kp b{font:600 32px 'Space Grotesk',sans-serif;letter-spacing:-.03em;line-height:1.1}.kp span{font:600 12.5px Manrope;color:#667085}
.dg{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;margin-top:14px}.dg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.gp{--ink:#101828;--mid:#667085;border-radius:22px;padding:20px 22px;border:1px solid rgba(255,255,255,.8);background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.72));box-shadow:0 10px 30px rgba(2,30,90,.16),inset 0 1px 0 #fff;color:#101828;min-width:0}.gp h3{margin:0 0 4px;font:600 17px 'Space Grotesk',sans-serif;letter-spacing:-.02em}.gp .muted{color:#667085;margin:0 0 8px;font-size:13px}.gp svg{width:100%;height:auto;display:block}
.gp>svg[aria-label="Booking status"],.gp>svg[aria-label="Bookings by status"]{max-width:180px;margin:10px auto}
.lg{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:7px}.lg li{display:flex;align-items:center;gap:9px;font:600 13px Manrope;color:#344054}.lg li i{width:10px;height:10px;border-radius:50%}.lg li b{margin-left:auto;color:#101828}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid rgba(16,24,40,.09);color:#101828;text-decoration:none}.li:first-of-type{border-top:0}.li span{display:grid}.li small{color:#667085;font-size:12px}.li em{font:600 12px Manrope;font-style:normal;color:#0a5fb0;background:rgba(31,107,255,.1);padding:5px 10px;border-radius:99px;white-space:nowrap}.li:hover b{color:#0a5fb0}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 90px 22px;gap:10px;align-items:center;padding:7px 0;font:600 13px Manrope;color:#344054}.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb div{height:8px;border-radius:9px;background:rgba(16,24,40,.08);overflow:hidden}.hb div i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#27d3f7,#1f6bff)}.hb b{text-align:right;color:#101828}
@media(max-width:980px){.dg,.dg3{grid-template-columns:1fr}}
/* ALL-GLASS BUTTONS */
.btn,.btn.p,.row .btn,.card .btn,.row .btn.p{backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:1px solid rgba(255,255,255,.75);box-shadow:0 8px 22px rgba(15,23,42,.14),inset 0 1px 0 rgba(255,255,255,.9)}
.btn{background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(255,255,255,.08));color:#fff}
.row .btn,.card .btn{background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,255,255,.35));color:#101828}
.btn.p,.row .btn.p{background:linear-gradient(160deg,rgba(31,107,255,.55),rgba(31,107,255,.2));color:#fff;border:1px solid rgba(255,255,255,.55)}.row .btn.p{color:#0B1B4D;background:linear-gradient(160deg,rgba(31,107,255,.28),rgba(31,107,255,.08))}
.btn:hover,.btn.p:hover{filter:none;transform:translateY(-1px);background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.2))}

  try{for(;;){const j=await call({...b,offset:off});sent+=j.sent;failed+=j.failed;off=j.next;$('#nst').textContent=`Sent ${sent}${failed?`, ${failed} failed`:''}… please keep this page open.`;if(j.done)break}$('#nst').textContent=`Finished. ${sent} sent${failed?`, ${failed} failed`:''}.`}
  catch(x){$('#nst').textContent=`Stopped after ${sent} sent: ${x.message}`}finally{window.__busy--;$('#nall').disabled=$('#ntest').disabled=false}}}

const BST={new:'New',pending:'New',confirmed:'Confirmed',completed:'Delivered',rejected:'Declined'},BCOL={new:'#B54708',pending:'#B54708',confirmed:'#023BE4',completed:'#067647',rejected:'#B42318'};
async function bookingsPage(){
 const [{data,error},sv,pk,rv]=await Promise.all([sb.from('bookings').select('*').order('created_at',{ascending:false}),sb.from('services').select('id,name'),sb.from('service_packages').select('id,name'),sb.from('reviews').select('booking_ref,rating,status')]);
 const S2=Object.fromEntries((sv.data||[]).map(x=>[x.id,x.name])),P2=Object.fromEntries((pk.data||[]).map(x=>[x.id,x.name])),R2=Object.fromEntries((rv.data||[]).filter(x=>x.booking_ref).map(x=>[x.booking_ref,x])),rows=data||[];
 const fd=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'';
 const card=r=>{const st=r.status==='pending'?'new':(r.status||'new'),open=st==='new',cf=st==='confirmed',dn=st==='completed',rj=st==='rejected',rev=R2[r.reference],wa=(r.phone||'').replace(/\D/g,'');
  return `<div class="row" data-id="${r.id}" data-st="${st}" data-s="${esc(JSON.stringify(r).toLowerCase())}"><div class="hd"><strong>${esc(r.full_name||r.name||'Customer')}</strong> <span class="muted">· ${esc(r.reference||'')}</span> <b style="color:${BCOL[st]||'#667085'}">${BST[st]||esc(st)}</b></div>
  <div class="muted">${[esc(S2[r.service_id]||''),esc(P2[r.package_id]||''),esc(r.photo_choice||'')].filter(Boolean).join(' · ')}</div>
  <div>${r.email?`<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`:''} ${r.phone?` · <a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>`:''} ${wa?` · <a target="_blank" rel="noopener" href="https://wa.me/${wa}">WhatsApp</a>`:''}</div>
  <div><span class="muted">Customer asked for:</span> <b>${r.preferred_date?esc(fd(r.preferred_date)):'no date given'}</b>${r.preferred_time?' · '+esc(r.preferred_time):''}<span class="muted"> · booked ${esc(new Date(r.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'}))}</span></div>
  ${cf||dn?`<div><span class="muted">Confirmed for:</span> <b>${esc(fd(r.confirmed_date)||'—')}</b>${r.confirmed_time?' · '+esc(r.confirmed_time):''}</div>`:''}
  ${dn?`<div><span class="muted">Delivered:</span> ${esc(fd((r.delivered_at||'').slice(0,10)))} · ${rev?`Review received (${'★'.repeat(rev.rating)}) — ${esc(rev.status)}. <a href="#reviews">Open Reviews</a>`:r.review_sent_at?'Review request sent. Waiting for the customer.':'Review request not sent yet.'}</div>`:''}
  ${open||cf||rj?`<div class="fields"><label>Date for this booking<input type="date" data-k="date" value="${esc(r.confirmed_date||r.preferred_date||'')}"></label><label>Time<input data-k="time" maxlength="60" placeholder="e.g. 10:00 AM" value="${esc(r.confirmed_time||'')}"></label></div><label>Message to the customer (optional, added to the email)<textarea data-k="msg" rows="2" maxlength="1000" placeholder="e.g. Please come with two outfit changes. Studio address: …"></textarea></label>`:''}
  <div class="bar" style="margin:0">${open||rj?'<button class="btn p" data-a="confirm">CONFIRM BOOKING</button>':''}${cf?'<button class="btn" data-a="confirm">UPDATE DATE &amp; RESEND</button><button class="btn p" data-a="delivered">MARK AS DELIVERED</button>':''}${open?'<button class="btn" data-a="decline">DECLINE</button>':''}${dn&&!rev?`<button class="btn" data-a="resend_review">${r.review_sent_at?'RESEND REVIEW REQUEST':'SEND REVIEW REQUEST'}</button>`:''}</div>
  <details><summary class="muted">Private notes</summary><textarea data-k="notes" rows="2" maxlength="2000">${esc(r.internal_notes||'')}</textarea><div class="bar" style="margin:8px 0 0"><button class="btn" data-a="notes">SAVE NOTES</button><button class="btn" data-a="del">DELETE</button></div></details></div>`};
 const cnt=k=>rows.filter(r=>(r.status==='pending'?'new':r.status)===k).length;
 $('#view').innerHTML=`<h1>Bookings</h1><p class="muted">Confirm a booking to email the customer the date. After the session is done, press Mark as delivered and the customer gets a link to write a review.</p>
 <div class="bar"><input id="q" placeholder="Search…"><select id="st"><option value="">All (${rows.length})</option><option value="new">New (${cnt('new')})</option><option value="confirmed">Confirmed (${cnt('confirmed')})</option><option value="completed">Delivered (${cnt('completed')})</option><option value="rejected">Declined (${cnt('rejected')})</option></select><span id="msg" class="muted" role="status"></span></div>`+(error?`<div class="row err">${esc(error.message)}</div>`:'')+(rows.length?'':'<div class="row muted">No booking requests yet.</div>')+rows.map(card).join('');
 const filt=()=>{const q=$('#q').value.toLowerCase(),s=$('#st').value;$$('.row[data-id]').forEach(r=>r.hidden=!((!q||r.dataset.s.includes(q))&&(!s||r.dataset.st===s)))};$('#q').oninput=filt;$('#st').onchange=filt;
 const call=async body=>{const {data:{session}}=await sb.auth.getSession();const r=await fetch('/api/booking-update',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(session?.access_token||'')},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Could not update the booking');return j};
 $('#view').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,row=b.closest('.row'),id=row.dataset.id,g=k=>row.querySelector(`[data-k="${k}"]`)?.value.trim()||'';
  if(a==='notes'){const {error}=await sb.from('bookings').update({internal_notes:g('notes')||null}).eq('id',id);return msg(error?'Could not save: '+error.message:'Notes saved.',!!error)}
  if(a==='del'){if(!confirm('Delete this booking permanently?'))return;const {error}=await sb.from('bookings').delete().eq('id',id);return error?msg(error.message,1):(await route(),msg('Deleted.'))}
  const body={id,action:a,date:g('date'),time:g('time'),message:g('msg')};
  if(a==='confirm'&&!body.date)return toast('Choose the date for this booking first.',1);
  if(a==='decline'&&!confirm('Decline this booking? The customer will be emailed.'))return;
  if(a==='delivered'&&!confirm('Mark as delivered? The customer will be emailed a link to write a review.'))return;
  window.__busy=(window.__busy||0)+1;const all=row.querySelectorAll('button');all.forEach(x=>x.disabled=true);
  try{const j=await call(body);await route();const done={confirm:'Booking confirmed.',decline:'Booking declined.',delivered:'Marked as delivered.',resend_review:'Review request sent.'}[a];j.emailed?toast(done+' The customer was emailed.'):toast(done+' '+(j.emailError||'Email not sent.'),1)}
  catch(x){all.forEach(y=>y.disabled=false);toast(x.message,1)}finally{window.__busy--}}}

async function route(){navBadge();const [h,sub]=(location.hash||'#dashboard').slice(1).split('/');$$('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h));
 $('#view').innerHTML='<p class="muted">Loading…</p>';const c=CFG[h];h==='galleries'?await galleriesPage(sub):h==='sendnews'?await sendNewsPage():h==='bookings'?await bookingsPage():h==='dashboard'||!c?await dash():c.forms?await settingsPage(c):await manager(c)}
addEventListener('hashchange',route);
const IC={dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',media:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',galleries:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',homepage:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',services:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>',packages:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',portfolio:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',blog:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',team:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',reviews:'<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',bookings:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',enquiries:'<path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M22 6l-10 7L2 6"/>',newsletter:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',sendnews:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',settings:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'},
GRP=[['Overview',['dashboard']],['Content',['media','galleries','homepage','services','packages','portfolio','blog','team']],['Business',['bookings','reviews','enquiries']],['Marketing',['newsletter','sendnews']],['System',['settings']]],NT=Object.fromEntries(NAV);
$('#nav').innerHTML=GRP.map(([g,l])=>`<div class="gl">${g}</div>`+l.map(h=>`<a href="#${h}"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[h]||''}</svg><span>${NT[h]}</span><i class="bd" hidden></i></a>`).join('')).join('');
$('#pgs').innerHTML=NAV.map(([h,t])=>`<option value="${esc(t)}">`).join('');
$('#gs').onchange=$('#gs').onkeydown=e=>{if(e.type==='keydown'&&e.key!=='Enter')return;const q=e.target.value.trim().toLowerCase();if(!q)return;const m=NAV.find(([h,t])=>t.toLowerCase()===q)||NAV.find(([h,t])=>t.toLowerCase().includes(q)||h.includes(q));if(m){location.hash='#'+m[0];e.target.value=''}};
async function navBadge(){try{const {count}=await sb.from('bookings').select('id',{count:'exact',head:true}).in('status',['new','pending']);const b=$('#nav a[href="#bookings"] .bd');if(b){b.textContent=count>99?'99+':count;b.hidden=!count}}catch{}}

const IDLE_MS=60000,WARN_MS=45000;let idleT,warnT,lastAct=Date.now();
const _uf=uploadFile;uploadFile=async(...a)=>{window.__busy=(window.__busy||0)+1;try{return await _uf(...a)}finally{window.__busy--}};
function bar(t){let b=$('#idle');if(!b){b=document.createElement('div');b.id='idle';b.setAttribute('role','alert');b.style.cssText='position:fixed;bottom:16px;right:16px;max-width:300px;background:#101828;color:#fff;padding:12px 16px;border-radius:12px;z-index:99;display:none;font:600 13px Manrope';document.body.appendChild(b)}b.style.display=t?'block':'none';b.textContent=t||''}
async function lock(){if(window.__busy)return poke();bar('');await sb.auth.signOut();location.reload()}
function poke(){if($('#app').style.display!=='grid')return;lastAct=Date.now();bar('');clearTimeout(idleT);clearTimeout(warnT);warnT=setTimeout(()=>bar('You will be signed out in 15 seconds because of inactivity. Move the mouse or press a key to stay.'),WARN_MS);idleT=setTimeout(lock,IDLE_MS)}
['mousemove','mousedown','keydown','scroll','touchstart','input','change'].forEach(ev=>addEventListener(ev,poke,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#app').style.display==='grid'&&Date.now()-lastAct>IDLE_MS)lock()});
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user)return;
 const {data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();
 if(p?.role!=='owner'){await sb.auth.signOut();$('#le').textContent='This account is not the site owner.';return}
 $('#login').style.display='none';$('#app').style.display='grid';route();poke()}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';const bt=$('#lf button.p');bt.disabled=true;bt.textContent='SIGNING IN…';const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 if(error){bt.disabled=false;bt.textContent='SIGN IN';return $('#le').textContent='Incorrect email or password.'}try{await boot()}finally{bt.disabled=false;bt.textContent='SIGN IN'}};
$('#fp').onclick=async()=>{const m=$('#em').value;if(!m)return $('#le').textContent='Enter your email first.';
 const {error}=await sb.auth.resetPasswordForEmail(m);$('#le').textContent=error?'Could not send the reset email.':'If that email belongs to the owner, a reset link has been sent.'};
$('#so').onclick=async()=>{await sb.auth.signOut();location.reload()};
boot();
</script></body></html>
