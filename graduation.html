<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graduation Photography — Lascot Studio</title>
<meta name="description" content="Graduation photography by Lascot Studio: packages, prices and sample graduation pictures.">
<link rel="icon" type="image/png" href="assets/favicon.png"><link rel="apple-touch-icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("lascot-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
:root{--bg:#FFFFFF;--ink:#0B1B4D;--mid:#5B6B8F;--line:#D6E2FB;--ph:#EAF1FF;--accent:#023BE4;--on:#FFFFFF;color-scheme:light}
:root[data-theme=dark]{--bg:#023BE4;--ink:#FFFFFF;--mid:rgba(255,255,255,.8);--line:rgba(255,255,255,.28);--ph:#2B5DF0;--accent:#FFFFFF;--on:#023BE4;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}html{background:var(--bg)}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.55;transition:background .4s,color .4s}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px max(16px,4vw);background:var(--bg);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font:600 15px 'Space Grotesk';letter-spacing:.12em}.logo img{width:34px;height:34px}
header nav{margin-left:auto;display:flex;align-items:center;gap:12px;font:600 13px Manrope;white-space:nowrap}header nav a.hm{display:none}@media(min-width:560px){header nav{gap:18px}header nav a.hm{display:inline}}.logo{min-width:0}@media(max-width:480px){header nav a.sm{display:none}}@media(max-width:420px){.logo{font-size:13px;letter-spacing:.08em}.logo img{width:30px;height:30px}}
#theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:16px}
.btn{display:inline-block;border:1px solid var(--ink);padding:13px 22px;border-radius:999px;font:600 13px Manrope;letter-spacing:.08em;cursor:pointer;background:none;color:var(--ink)}.btn.p{background:var(--accent);color:var(--on);border-color:var(--accent)}
.wrap{padding:0 max(16px,6vw)}
.hero{padding-block:clamp(48px,9vw,110px) clamp(36px,6vw,70px)}.hero small{font:600 12px Manrope;letter-spacing:.18em;color:var(--mid)}
h1{font:500 clamp(40px,8vw,104px)/1 'Space Grotesk',sans-serif;letter-spacing:-.05em;margin:14px 0 18px;text-wrap:balance}
.lead{font:italic 400 clamp(18px,2vw,26px)/1.5 'Playfair Display',serif;max-width:56ch;color:var(--mid)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
section{padding:clamp(44px,7vw,84px) 0;border-top:1px solid var(--line)}
h2{font:500 clamp(28px,4vw,52px)/1.05 'Space Grotesk',sans-serif;letter-spacing:-.04em;margin-bottom:10px}
.muted{color:var(--mid)}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px;margin-top:24px}
.pk{border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0}.pk.f{border-color:var(--accent);border-width:2px}
.pk h3{font:500 24px 'Space Grotesk'}.pk .pr{font:500 32px 'Space Grotesk';letter-spacing:-.03em}.pk ul{padding-left:18px;display:grid;gap:4px}.pk .tag{font:600 11px Manrope;letter-spacing:.14em;color:var(--accent)}
.pk .spl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pk .spl img{aspect-ratio:1;object-fit:cover;border-radius:10px;width:100%}
.pk .go{margin-top:auto;padding-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px;margin-top:24px}
.grid img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:16px;background:var(--ph);cursor:zoom-in}
.empty{border:1px dashed var(--line);border-radius:16px;padding:28px;color:var(--mid);margin-top:24px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px;margin-top:24px;counter-reset:s}.steps div{counter-increment:s;border-top:2px solid var(--ink);padding-top:12px}.steps div:before{content:counter(s,decimal-leading-zero);font:500 14px 'Space Grotesk';color:var(--mid);display:block;margin-bottom:4px}
footer{padding:36px max(16px,6vw) 48px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;color:var(--mid);font-size:14px}footer a{color:var(--ink);text-decoration:underline}

#bk{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:30;padding:16px;overflow:auto}#bk.on{display:flex}
#bk .bx{background:var(--bg);color:var(--ink);border-radius:22px;padding:24px;width:min(100%,480px);margin:auto;display:grid;gap:12px;border:1px solid var(--line)}
#bk h3{font:500 26px 'Space Grotesk';letter-spacing:-.03em}#bk label{display:grid;gap:4px;font:600 12px Manrope;letter-spacing:.06em;color:var(--mid)}
#bk input,#bk select{font:500 16px Manrope;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
#bk .x{justify-self:end;background:none;border:0;color:var(--ink);font-size:28px;cursor:pointer;line-height:1}#bk .fm{font-weight:600}#bk .fm.e{color:#B42318}[data-theme=dark] #bk .fm.e{color:#FFD7D2}
#bk .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}#bk .po{display:grid;gap:8px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}#lb.on{display:flex}#lb img{max-height:92vh;max-width:96vw;object-fit:contain;border-radius:8px}
#lb button{position:absolute;top:14px;right:18px;background:none;border:0;color:#fff;font-size:34px;cursor:pointer}
</style></head><body>
<header><a class="logo" href="/"><img src="assets/logo.png" alt="Lascot Studio logo">LASCOT STUDIO</a><nav><a class="hm" href="/">Main site</a><a href="#packages">Packages</a><a class="sm" href="#samples">Samples</a><button id="theme" aria-label="Switch theme">◐</button></nav></header>
<main id="m"><div class="wrap hero"><small>LASCOT STUDIO</small><h1>Graduation</h1><p class="lead">Loading…</p></div></main>
<footer id="ft"></footer>
<div id="bk" role="dialog" aria-label="Book this package"><div class="bx" id="bx"></div></div>
<div id="lb" role="dialog" aria-label="Photo viewer"><button aria-label="Close">×</button><img alt=""></div>
<script>(()=>{
const U='https://vapxkssbrggpuyfehqwi.supabase.co',K='sb_publishable_dqv7RhuBbqUpccJfX1H1QQ_mJ908tRk',H={apikey:K,Authorization:'Bearer '+K};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n==null?'':'₦'+Number(n).toLocaleString('en-NG'),pub=(b,p)=>`${U}/storage/v1/object/public/${b}/${p}`;
const get=async q=>{try{const j=await(await fetch(U+'/rest/v1/'+q,{headers:H})).json();return Array.isArray(j)?j:[]}catch{return[]}};
const nk=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const opts=p=>Array.isArray(p.photo_options)?p.photo_options.filter(o=>o&&o.label):[];
const pkp=p=>{if(+p.price_ngn)return money(p.price_ngn);const q=opts(p).map(o=>+o.price).filter(Boolean);return q.length?'From '+money(Math.min(...q)):'Price on request'};
const optTxt=o=>o.label+(+o.price?' · '+money(o.price):'');
const DC={whatsapp:'+2348133355342',phone:'+2348133355342',email:'Lascotstudios@gmail.com',instagram:'https://www.instagram.com/lascotstudios/'};
$('#theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('lascot-theme',d)}catch{}};
(async()=>{
 const [sv,pk,md,st]=await Promise.all([get('services?select=*&order=sort_order'),get('service_packages?select=*&order=sort_order'),get('media_assets?select=*&kind=eq.image&order=sort_order'),get('website_settings?select=key,value')]);
 const set={};st.forEach(x=>set[x.key]=x.value);const c={...DC,...Object.fromEntries(Object.entries(set.contact||{}).filter(([k,v])=>v))};
 const g=sv.find(v=>nk(v.slug)==='graduation')||sv.find(v=>nk(v.name).includes('graduat'));
 const wa=String(c.whatsapp||'').replace(/\D/g,'');
 const msg=t=>`https://wa.me/${wa}?text=${encodeURIComponent(t)}`;
 const packs=g?pk.filter(p=>p.service_id===g.id&&p.available!==false):[];
 const pics=g?md.filter(m=>{const a=nk(m.category);return a&&(a===nk(g.name)||a===nk(g.slug)||a.includes('graduat'))}).map(m=>({...m,url:pub(m.bucket,m.path)})):[];
 const book=p=>`/#booking`;
 const packHtml=packs.length?`<div class="packs">${packs.map(p=>`<article class="pk${p.featured?' f':''}">${p.featured?'<span class="tag">MOST POPULAR</span>':''}<h3>${esc(p.name)}</h3><div class="pr">${esc(pkp(p))}</div>${p.description?`<p class="muted">${esc(p.description)}</p>`:''}${(p.inclusions||[]).length?`<ul>${p.inclusions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${opts(p).length?`<div><b>Choose your number of photos</b><ul>${opts(p).map(o=>`<li>${esc(optTxt(o))}</li>`).join('')}</ul></div>`:''}${(p.sample_images||[]).length?`<div class="spl">${p.sample_images.slice(0,3).map(u=>`<img src="${esc(u)}" alt="Sample from ${esc(p.name)}" loading="lazy">`).join('')}</div>`:''}<div class="go" style="display:grid;gap:8px"><button class="btn p" data-book="${esc(p.id)}">BOOK THIS PACKAGE</button><a class="btn" target="_blank" rel="noopener" href="${msg('Hello Lascot Studio, I would like to ask about the '+p.name+' graduation package.')}">ASK ON WHATSAPP</a></div></article>`).join('')}</div>`:`<div class="empty">Graduation packages and prices will be listed here soon.</div>`;
 const picHtml=pics.length?`<div class="grid">${pics.map((m,i)=>`<img data-i="${i}" src="${esc(m.url)}" alt="${esc(m.alt_text||m.title||'Graduation photo')}" loading="lazy">`).join('')}</div>`:`<div class="empty">Graduation sample pictures will be added here soon.</div>`;
 $('#m').innerHTML=`<div class="wrap hero"><small>LASCOT STUDIO · GRADUATION</small><h1>Graduation photography</h1><p class="lead">${esc(g&&(g.summary||g.description)?String(g.summary||g.description).split(/\n{2,}/)[0]:'Celebrate the day you worked so hard for with photographs you will keep for life.')}</p><div class="cta"><a class="btn p" href="#packages">SEE PACKAGES</a><a class="btn" href="#samples">VIEW SAMPLES</a></div></div>
 <div class="wrap"><section id="packages"><h2>Packages and prices</h2><p class="muted">Pick the package that fits you. Prices are in naira.</p>${packHtml}</section>
 <section id="samples"><h2>Graduation samples</h2><p class="muted">A look at graduation days we have photographed.</p>${picHtml}</section>
 <section><h2>How it works</h2><div class="steps"><div><b>Choose a package</b><p class="muted">Pick what suits you from the list above.</p></div><div><b>Book your date</b><p class="muted">Message us on WhatsApp or use the booking form on the main site.</p></div><div><b>Graduation day</b><p class="muted">We photograph you, your friends and your family.</p></div><div><b>Get your photos</b><p class="muted">Your pictures are delivered privately.</p></div></div>
 <div class="cta"><a class="btn p" target="_blank" rel="noopener" href="${msg('Hello Lascot Studio, I would like to ask about graduation photography.')}">ASK ON WHATSAPP</a><a class="btn" href="/#booking">BOOK ON THE MAIN SITE</a></div></section></div>`;
 $('#ft').innerHTML=`<span>© Lascot Studio</span><a href="/">Back to the main site</a>${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:''}${c.instagram?`<a target="_blank" rel="noopener" href="${/^https?:\/\//i.test(c.instagram)?esc(c.instagram):'#'}">Instagram</a>`:''}`;

 // ---- booking + online payment ----
 const rpc=async(n,b)=>{const r=await fetch(`${U}/rest/v1/rpc/${n}`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error('rpc');const t=await r.text();try{return JSON.parse(t)}catch{return t}};
 const N=k=>'₦'+(Number(k)/100).toLocaleString('en-NG',{maximumFractionDigits:2}),bk=$('#bk'),bx=$('#bx'),lblk={deposit:'Pay deposit',full:'Pay full amount',balance:'Pay the balance'};
 const closeBk=()=>bk.classList.remove('on');
 const payStep=async(ref)=>{let d=null;try{d=await(await fetch('/api/pay-info?reference='+encodeURIComponent(ref),{cache:'no-store'})).json()}catch{}
  const can=d&&d.enabled&&d.options&&d.options.length;
  bx.innerHTML=`<button class="x" aria-label="Close" data-close>×</button><h3>Request received</h3><p class="muted">Your booking reference is <b>${esc(ref)}</b>. We will contact you to confirm your date.</p>${can?`<p><b>Secure your date by paying online.</b></p>${d.options.map((o,i)=>`<button class="btn ${i?'':'p'}" data-pay="${o.kind}">${lblk[o.kind]} · ${N(o.amount)}</button>`).join('')}<p class="muted" id="pe" role="alert"></p><p class="muted" style="font-size:14px">Pay securely on Paystack with your card or bank.${d.options.some(o=>o.kind==='deposit')?` The deposit is ${d.deposit_percent}% of the price and you pay the rest later.`:''} You can also pay later from the link in your confirmation.</p>`:'<p class="muted">The studio will tell you how to pay.</p>'}<button class="btn" data-close>CLOSE</button>`;
  bx.querySelectorAll('[data-pay]').forEach(b=>b.onclick=async()=>{b.disabled=true;$('#pe').textContent='Opening Paystack…';try{const r=await fetch('/api/pay-init',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:ref,kind:b.dataset.pay})}),j=await r.json();if(!r.ok||!j.url)throw new Error(j.error||'');location.href=j.url}catch(e){b.disabled=false;$('#pe').className='fm e';$('#pe').textContent=e.message||'Could not start the payment. Please try again.'}})};
 const openBk=p=>{const o=opts(p),cust=p.allow_custom_photos,t=new Date(),min=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  bx.innerHTML=`<button class="x" aria-label="Close" data-close>×</button><h3>Book ${esc(p.name)}</h3><p class="muted">${esc(pkp(p))}. Fill in your details and choose your date.</p><form id="bkf" style="display:grid;gap:12px"><label>Your name<input name="name" required maxlength="120" autocomplete="name"></label><label>Email<input name="email" type="email" required maxlength="200" autocomplete="email"></label><label>Phone / WhatsApp<input name="phone" type="tel" required maxlength="40" autocomplete="tel"></label><div class="two"><label>Preferred date<input name="date" type="date" required min="${min}"></label><label>Time (optional)<input name="time" maxlength="40" placeholder="e.g. 10am"></label></div>${o.length||cust?`<label>How many photos?<select name="opt" required><option value="">Choose…</option>${o.map(y=>`<option value="${esc(optTxt(y))}">${esc(optTxt(y))}</option>`).join('')}${cust?'<option value="custom">Other: I will type how many</option>':''}</select></label><label id="cw" hidden>Number of photos<input name="cust" type="number" min="1" max="1000"></label>`:''}<button class="btn p" type="submit">SEND BOOKING REQUEST</button><p class="fm" id="bm" role="status"></p></form>`;
  const f=$('#bkf');if(f.opt)f.opt.onchange=()=>{$('#cw').hidden=f.opt.value!=='custom'};
  f.onsubmit=async e=>{e.preventDefault();const bm=$('#bm');bm.className='fm';let choice='';if(f.opt){const v=f.opt.value;if(v==='custom'){const n=parseInt(f.cust.value,10);if(!(n>0)){bm.className='fm e';return bm.textContent='Please type how many photos you want.'}choice='Custom: '+n+' photos (studio to quote)'}else choice=v}
   const btn=f.querySelector('button[type=submit]');btn.disabled=true;bm.textContent='Sending…';
   try{const ref=await rpc('submit_booking',{p_name:f.name.value,p_email:f.email.value,p_phone:f.phone.value,p_service:g.id,p_package:p.id});if(choice)await rpc('set_booking_photo_choice',{p_ref:ref,p_choice:choice}).catch(()=>{});await rpc('set_booking_date',{p_ref:ref,p_date:f.date.value,p_time:f.time.value||null}).catch(()=>{});fetch('/api/booking-notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:ref}),keepalive:true}).catch(()=>{});await payStep(ref)}catch{btn.disabled=false;bm.className='fm e';bm.textContent='Could not send your request. Please check your details and try again.'}};
  bk.classList.add('on');setTimeout(()=>f.name.focus(),50)};
 document.addEventListener('click',e=>{const b=e.target.closest('[data-book]');if(b){const p=packs.find(x=>String(x.id)===b.dataset.book);if(p)openBk(p);return}if(e.target.closest('[data-close]')||e.target===bk)closeBk()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBk()});
 const lb=$('#lb'),li=lb.querySelector('img');document.addEventListener('click',e=>{const t=e.target;if(t.matches('.grid img')){li.src=pics[+t.dataset.i].url;lb.classList.add('on')}else if(lb.classList.contains('on')&&(t===lb||t.tagName==='BUTTON'))lb.classList.remove('on')});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on')});
})();
})();</script></body></html>
