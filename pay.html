<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay for your booking — Lascot Studio</title><meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("lascot-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
:root{--bg:#FFFFFF;--ink:#0B1B4D;--mid:#5B6B8F;--line:#D6E2FB;--ph:#EAF1FF;--accent:#023BE4;--on:#FFFFFF;color-scheme:light}
:root[data-theme=dark]{--bg:#023BE4;--ink:#FFFFFF;--mid:rgba(255,255,255,.8);--line:rgba(255,255,255,.28);--ph:#2B5DF0;--accent:#FFFFFF;--on:#023BE4;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}html{background:var(--bg)}body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:10px;padding:14px max(16px,4vw);border-bottom:1px solid var(--line);font:600 15px 'Space Grotesk';letter-spacing:.12em}header img{width:34px;height:34px}header a{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
main{max-width:520px;margin:0 auto;padding:clamp(28px,6vw,64px) max(16px,5vw)}
h1{font:500 clamp(30px,6vw,44px)/1.05 'Space Grotesk',sans-serif;letter-spacing:-.04em;margin-bottom:8px}.muted{color:var(--mid)}
.card{border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:22px;display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:14px}.row b{font-family:'Space Grotesk'}
.btn{display:block;width:100%;text-align:center;border:1px solid var(--ink);padding:14px 20px;border-radius:999px;font:600 13px Manrope;letter-spacing:.08em;cursor:pointer;background:none;color:var(--ink);text-decoration:none}.btn.p{background:var(--accent);color:var(--on);border-color:var(--accent)}.btn[disabled]{opacity:.6;cursor:wait}
.err{color:#B42318;font-weight:600}[data-theme=dark] .err{color:#FFD7D2}.ok{font-size:44px}

/* GLASS LOOK: same as the main site */
:root{--bg:#f4f5ff;--ink:#0B1B4D;--mid:#5B6B8F;--line:rgba(15,23,42,.10);--ph:#f1f3f7;--accent:#023BE4;--gl:rgba(255,255,255,.6);--glb:rgba(15,23,42,.08);--gsh:0 22px 60px rgba(15,23,42,.10),0 2px 8px rgba(15,23,42,.05),inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.7)}
:root[data-theme=dark]{--bg:#2b2f45;--ink:#FFFFFF;--mid:rgba(255,255,255,.8);--line:rgba(255,255,255,.22);--ph:#3b4060;--accent:#dfe6ff;--gl:rgba(255,255,255,.16);--glb:rgba(255,255,255,.34);--gsh:0 14px 40px rgba(10,14,40,.28),inset 0 1px 0 rgba(255,255,255,.35)}
html,html[data-theme=dark]{background-color:#f5f6ff;background-image:radial-gradient(70% 360px at 0% 120px,rgba(110,130,255,.34),transparent 72%),radial-gradient(60% 320px at 100% 260px,rgba(170,150,255,.26),transparent 72%),radial-gradient(80% 420px at 30% 640px,rgba(120,150,255,.20),transparent 72%),linear-gradient(180deg,#eceeff,#f6f7ff 55%,#eef1ff);background-size:100% 1100px;background-repeat:repeat-y}
html[data-theme=dark]{background-color:#2b2f45;background-image:radial-gradient(70% 360px at 0% 120px,rgba(140,160,255,.42),transparent 72%),radial-gradient(60% 320px at 100% 260px,rgba(190,160,255,.30),transparent 72%),radial-gradient(80% 420px at 30% 640px,rgba(130,170,255,.24),transparent 72%),linear-gradient(180deg,#343a5c,#2b2f45 55%,#323757)}
body{background:transparent!important}
header{background:var(--gl);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--glb);box-shadow:0 8px 30px rgba(20,70,190,.10)}
:root[data-theme=dark] header{background:rgba(60,66,100,.45)}
.pk,.empty,.card,.steps div,#bk .bx{background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.5));border:1px solid var(--glb);border-radius:22px;box-shadow:var(--gsh);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%)}
:root[data-theme=dark] .pk,:root[data-theme=dark] .empty,:root[data-theme=dark] .card,:root[data-theme=dark] .steps div,:root[data-theme=dark] #bk .bx{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05))}
.steps div{padding:18px}.empty{border-style:solid}.pk.f{border-color:rgba(2,59,228,.35);border-width:1px}:root[data-theme=dark] .pk.f{border-color:rgba(255,255,255,.55)}
section{border-top:1px solid var(--line)}
footer{border-top:1px solid var(--line)}
#bk{background:rgba(5,10,40,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bk input,#bk select{background:var(--gl);border:1px solid var(--glb);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
:root[data-theme=dark] #bk select option{color:#0B1B4D}
.btn,#theme{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(160deg,rgba(255,255,255,.42),rgba(255,255,255,.10));backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(2,59,228,.14),inset 0 1px 1px #fff,inset 0 -8px 16px rgba(2,59,228,.07),inset 0 0 0 1px rgba(2,59,228,.07);color:#023BE4;text-shadow:0 1px 0 rgba(255,255,255,.95),0 0 14px rgba(255,255,255,.7);transition:background .25s,transform .2s}
.btn.p{font-weight:700;background:linear-gradient(160deg,rgba(255,255,255,.42),rgba(255,255,255,.10));color:#023BE4;border-color:rgba(255,255,255,.9)}
.btn::before,#theme::before{content:"";position:absolute;left:3%;right:3%;top:1px;height:48%;border-radius:99px 99px 60% 60%/99px 99px 24px 24px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none;z-index:-1}
.btn:hover,#theme:hover{background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(255,255,255,.2));transform:translateY(-1px)}
:root[data-theme=dark] .btn,:root[data-theme=dark] .btn.p,:root[data-theme=dark] #theme{background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.08));border-color:rgba(255,255,255,.4);box-shadow:0 10px 26px rgba(10,14,40,.3),inset 0 1px 1px rgba(255,255,255,.55);color:#fff;text-shadow:0 0 14px rgba(255,255,255,.55),0 1px 2px rgba(0,0,0,.4)}
:root[data-theme=dark] .btn::before,:root[data-theme=dark] #theme::before{background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0))}
:root[data-theme=dark] .btn:hover,:root[data-theme=dark] .btn.p:hover,:root[data-theme=dark] #theme:hover{background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(255,255,255,.06));color:#fff}
#bk .x{background:none;border:0;box-shadow:none;backdrop-filter:none;text-shadow:none;color:var(--ink);width:auto;height:auto}#bk .x::before{display:none}
#theme{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border-radius:99px;font-size:0}#theme svg{position:absolute;width:16px;height:16px;transition:transform .5s,opacity .3s}
:root[data-theme=dark] .sun{opacity:0;transform:rotate(90deg) scale(.4)}:root:not([data-theme=dark]) .moon{opacity:0;transform:rotate(-90deg) scale(.4)}
</style></head><body>
<header><a href="/"><img src="assets/logo.png" alt="">LASCOT STUDIO</a><button style="margin-left:auto" id="theme" aria-label="Switch theme"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button></header>
<main id="m"><h1>Your booking</h1><p class="muted">Loading…</p></main>
<script>(()=>{
document.querySelector('#theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('lascot-theme',d)}catch{}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=k=>'₦'+(Number(k)/100).toLocaleString('en-NG',{maximumFractionDigits:2});
const qs=new URLSearchParams(location.search),ref=(qs.get('reference')||'').trim(),back=qs.has('trxref')||qs.has('reference')&&qs.has('trxref');
const info=async()=>{const r=await fetch('/api/pay-info?reference='+encodeURIComponent(ref),{cache:'no-store'});if(r.status===404)return{missing:true};if(!r.ok)throw 0;return r.json()};
const lbl={deposit:'Pay deposit',full:'Pay full amount',balance:'Pay the balance'};
function draw(d){
 if(d.missing)return $('#m').innerHTML='<h1>Booking not found</h1><p class="muted">Check the link, or contact the studio.</p><p style="margin-top:20px"><a class="btn" href="/">BACK TO THE SITE</a></p>';
 if(!d.enabled)return $('#m').innerHTML='<h1>Online payment is not available</h1><p class="muted">Please contact the studio to arrange payment.</p><p style="margin-top:20px"><a class="btn" href="/#contact">CONTACT THE STUDIO</a></p>';
 const done=d.total_kobo&&d.balance_kobo<=0,paidAny=d.paid_kobo>0,conf=d.booking_status==='confirmed'||d.booking_status==='completed',fdt=x=>x?new Date(x+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
 $('#m').innerHTML=`${paidAny?'<div class="ok">✓</div>':''}<h1>${done?'Payment received':paidAny?'Deposit received':'Pay for your booking'}</h1><p class="muted">${esc(d.first_name?'Hello '+d.first_name+'. ':'')}${paidAny?(conf?'Your booking is confirmed'+(d.confirmed_date?' for <b>'+esc(fdt(d.confirmed_date))+(d.confirmed_time?' · '+esc(d.confirmed_time):'')+'</b>':'')+'. We sent the details to your email.':'Your booking is <b>waiting for confirmation</b>'+(d.preferred_date?' (you asked for '+esc(fdt(d.preferred_date))+')':'')+'. We will email you as soon as Lascot Studio confirms it.'):'Booking reference '+esc(ref)}</p>
 <div class="card">${d.service?`<div class="row"><span class="muted">Service</span><b>${esc(d.service)}</b></div>`:''}${d.package?`<div class="row"><span class="muted">Package</span><b>${esc(d.package)}</b></div>`:''}${d.photo_choice?`<div class="row"><span class="muted">Choice</span><b>${esc(d.photo_choice)}</b></div>`:''}
 ${d.total_kobo?`<div class="row"><span class="muted">Total price</span><b>${N(d.total_kobo)}</b></div><div class="row"><span class="muted">Paid so far</span><b>${N(d.paid_kobo)}</b></div><div class="row"><span class="muted">Balance</span><b>${N(d.balance_kobo)}</b></div>`:'<p class="muted">The studio will send you the price for this booking, so it cannot be paid online yet.</p>'}</div>
 ${d.locked?`<p class="muted" style="margin-top:18px">Thank you for your deposit. The balance of <b>${N(d.balance_kobo)}</b> is paid once your photos are delivered. We will email you the link then.</p>`:''}${d.options.length?`<div style="display:grid;gap:10px;margin-top:18px">${d.options.map((o,i)=>`<button class="btn ${i===0?'p':''}" data-k="${o.kind}">${lbl[o.kind]} · ${N(o.amount)}</button>`).join('')}</div><p class="muted" id="pe" role="alert" style="margin-top:10px"></p><p class="muted" style="margin-top:14px;font-size:14px">You will pay securely on Paystack with your card or bank.${d.options.some(o=>o.kind==='deposit')?` The deposit is ${d.deposit_percent}% of the price. You pay the rest when your photos are delivered.`:''}</p>`:''}
 <p style="margin-top:20px"><a class="btn" href="/">BACK TO THE SITE</a></p>`;
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{b.disabled=true;$('#pe').textContent='Opening Paystack…';try{const r=await fetch('/api/pay-init',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:ref,kind:b.dataset.k})}),j=await r.json();if(!r.ok||!j.url)throw new Error(j.error||'');location.href=j.url}catch(e){b.disabled=false;$('#pe').className='err';$('#pe').textContent=e.message||'Could not start the payment. Please try again.'}});
}
(async()=>{try{if(!ref)return draw({missing:true});
 const verify=async()=>{try{await fetch('/api/pay-verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:ref})})}catch(e){}};
 const settle=async()=>{$('#m').innerHTML='<h1>Confirming your payment…</h1><p class="muted">This takes a few seconds. Please do not close this page, and do not pay again.</p>';let d=null;for(let i=0;i<8;i++){await verify();d=await info();if(d.missing||!d.enabled||d.status!=='unpaid')return d;await new Promise(r=>setTimeout(r,2500))}return d};
 let d;
 if(back){d=await settle();if(d.status==='unpaid'&&d.enabled&&!d.missing){$('#m').innerHTML='<h1>We are still confirming your payment</h1><p class="muted">If Paystack took the money, you do not need to pay again. Booking reference <b>'+esc(ref)+'</b>. Tap the button to check again, or contact the studio with this reference.</p><div style="display:grid;gap:10px;margin-top:18px"><button class="btn p" id="again">CHECK AGAIN</button><a class="btn" href="/#contact">CONTACT THE STUDIO</a></div>';$('#again').onclick=()=>location.reload();return}}
 else d=await info();
 draw(d)}catch{$('#m').innerHTML='<h1>Something went wrong</h1><p class="muted">Please refresh the page.</p>'}})();
})();</script></body></html>
